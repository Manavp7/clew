<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>clew — Canonical Intelligence Engine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/graphology/0.25.4/graphology.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sigma.js/2.4.0/sigma.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #111; }
    header { padding: 10px 16px; background: #0b1020; color: #fff; display: flex; gap: 16px; align-items: center; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header .sub { color: #9aa4bf; font-size: 12px; }
    #wrap { display: flex; height: calc(100vh - 46px); }
    #graph { flex: 1; background: #f7f8fb; }
    #side { width: 420px; border-left: 1px solid #e5e7eb; padding: 14px; overflow-y: auto; }
    .pill { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 999px; padding: 1px 8px; font-size: 11px; margin-left: 6px; }
    .claim { border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin: 8px 0; }
    .claim .rel { font-weight: 600; }
    .snippet { background: #fffbeb; border-left: 3px solid #f59e0b; padding: 6px 8px; font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
    .muted { color: #6b7280; font-size: 12px; }
    input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 8px; }
    .row { display: flex; gap: 8px; align-items: baseline; }
    .stake { font-variant-numeric: tabular-nums; font-weight: 600; color: #065f46; }
    .search-result { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .search-result:hover { background: #eef2ff; }
    h3 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>clew</h1>
    <span class="sub">Canonical Intelligence Engine · 13D/13G beneficial ownership</span>
    <span class="sub" id="stats"></span>
  </header>
  <div id="wrap">
    <div id="graph"></div>
    <div id="side">
      <input id="search" placeholder="Search entities (semantic)…" />
      <div id="search-results"></div>
      <div id="detail"><p class="muted">Click a node to inspect an entity, its evidence-backed claims, and stake-change timeline.</p></div>
    </div>
  </div>

  <script>
    const API = location.origin;
    let renderer, graph;

    async function j(url) { const r = await fetch(API + url); if (!r.ok) throw new Error(r.status); return r.json(); }

    const palette = { Organization: '#2563eb', Person: '#db2777', Security: '#16a34a' };

    async function loadGraph() {
      const data = await j('/graph');
      graph = new graphology.Graph({ multi: true, type: 'directed' });
      data.nodes.forEach((n, i) => {
        graph.addNode(n.id, {
          label: n.label, x: Math.cos(i) * (1 + i % 7), y: Math.sin(i) * (1 + i % 5),
          size: Math.max(4, 4 + (n.degree || 0) * 2), color: palette[n.type] || '#64748b',
          entityType: n.type
        });
      });
      data.edges.forEach(e => {
        try {
          graph.addEdgeWithKey(e.id, e.source, e.target, {
            label: e.predicate + (e.stake_pct != null ? ` ${e.stake_pct}%` : ''),
            size: 2, color: '#94a3b8', type: 'arrow'
          });
        } catch (_) {}
      });
      const container = document.getElementById('graph');
      if (renderer) renderer.kill();
      renderer = new Sigma(graph, container, { renderEdgeLabels: true });
      renderer.on('clickNode', ({ node }) => showEntity(node));
      document.getElementById('stats').textContent = `${data.nodes.length} entities · ${data.edges.length} ownership edges`;
    }

    function fmtClaim(c) {
      const obj = c.object ? c.object.name : (c.object_literal ? JSON.stringify(c.object_literal) : '—');
      const stake = c.qualifiers && c.qualifiers.stake_pct != null ? `<span class="stake">${c.qualifiers.stake_pct}%</span>` : '';
      const ev = (c.evidence || []).map(e =>
        `<div class="snippet">“${e.snippet}” <span class="muted">— doc ${e.document_id} [${e.char_start}:${e.char_end}]</span></div>`).join('');
      return `<div class="claim">
        <div class="row"><span class="rel">${c.predicate}</span> ${stake}</div>
        <div>→ <b>${obj}</b></div>
        <div class="muted">valid_from ${c.valid_from || '?'} · conf ${c.confidence} · ${c.extractor}</div>
        ${ev}</div>`;
    }

    async function showEntity(id) {
      const e = await j('/entities/' + id);
      let tl = null;
      try { tl = await j('/timeline?subject=' + encodeURIComponent(id) + '&predicate=OWNS'); } catch (_) {}
      const cik = e.external_ids && e.external_ids.cik ? `<span class="pill">CIK ${e.external_ids.cik}</span>` : '';
      let html = `<h2 style="margin:4px 0">${e.canonical_name} ${cik}</h2>
        <div class="muted">${e.id} · ${e.type}${e.aliases.length ? ' · aka ' + e.aliases.slice(0,3).join(', ') : ''}</div>`;
      if (tl && tl.points.length) {
        html += '<h3>Stake-change timeline</h3>';
        html += tl.points.map(p => `<div class="row"><span class="muted">${p.valid_from || '?'}</span> → <span class="stake">${p.stake_pct != null ? p.stake_pct + '%' : '—'}</span> <span class="muted">(${p.object || ''})</span></div>`).join('');
      }
      html += `<h3>Claims as subject (${e.claims_as_subject.length})</h3>` + e.claims_as_subject.map(fmtClaim).join('');
      if (e.claims_as_object.length) html += `<h3>Claims as object (${e.claims_as_object.length})</h3>` + e.claims_as_object.map(fmtClaim).join('');
      document.getElementById('detail').innerHTML = html;
    }

    let t;
    document.getElementById('search').addEventListener('input', (ev) => {
      clearTimeout(t);
      const q = ev.target.value.trim();
      const box = document.getElementById('search-results');
      if (!q) { box.innerHTML = ''; return; }
      t = setTimeout(async () => {
        const r = await j('/search?q=' + encodeURIComponent(q) + '&limit=8');
        box.innerHTML = r.results.map(x =>
          `<div class="search-result" onclick="showEntity('${x.id}')">${x.canonical_name} <span class="muted">${x.score}</span></div>`).join('');
      }, 250);
    });

    loadGraph().catch(e => document.getElementById('graph').innerHTML = '<p style="padding:16px">Failed to load graph: ' + e + '</p>');
  </script>
</body>
</html>
