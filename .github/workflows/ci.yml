name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clew
          POSTGRES_PASSWORD: clew
          POSTGRES_DB: clew
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clew"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLEW_DATABASE_URL: postgresql+psycopg://clew:clew@localhost:5432/clew
      CLEW_SEC_USER_AGENT: clew-ci ci@example.com
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest
